name: Bug report
description: Report a reproducible problem in the public synthetic sample
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, tenant or subscription identifiers, customer data, or private resource details. Report vulnerabilities privately under SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using only synthetic data and public repository files.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Commit hash or branch where the problem occurs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment
      description: Include tool versions and operating system only. Do not include Azure identifiers.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I used synthetic data only.
          required: true
        - label: I removed secrets and environment-specific identifiers.
          required: true
        - label: This is not a security vulnerability or production incident.
          required: true
